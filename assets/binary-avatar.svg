    <text x="38" y="303.6" xml:space="preserve" class="mono"><tspan class="sp"> </tspan><tspan class="bit-1">11111111111111111111111111</tspan><tspan class="bit-0">0</tspan><tspan class="sp">                            </tspan></text>
    <text x="38" y="316.4" xml:space="preserve" class="mono"><tspan class="bit-0">0</tspan><tspan class="bit-1">11</tspan><tspan class="bit-0">000</tspan><tspan class="bit-1">111111111111111111</tspan><tspan class="bit-0">000</tspan><tspan class="sp">                             </tspan></text>
    <text x="38" y="329.2" xml:space="preserve" class="mono"><tspan class="bit-1">11</tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">1</tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">11111111111111111</tspan><tspan class="bit-0">00</tspan><tspan class="sp">                                </tspan></text>
    <text x="38" y="342.0" xml:space="preserve" class="mono"><tspan class="bit-0">0</tspan><tspan class="bit-1">1111111111111111111</tspan><tspan class="bit-0">0</tspan><tspan class="sp">                                   </tspan></text>
    <text x="38" y="354.8" xml:space="preserve" class="mono"><tspan class="sp"> </tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">11111</tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">11111111</tspan><tspan class="bit-0">0</tspan><tspan class="sp">                                       </tspan></text>
    <text x="38" y="367.6" xml:space="preserve" class="mono"><tspan class="sp">   </tspan><tspan class="bit-0">0</tspan><tspan class="sp">   </tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">11</tspan><tspan class="bit-0">00000</tspan><tspan class="sp">                                         </tspan></text>
