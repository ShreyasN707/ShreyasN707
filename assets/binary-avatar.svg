    <text x="38" y="150.0" xml:space="preserve" class="mono"><tspan class="sp">             </tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">111111</tspan><tspan class="bit-0">0000000</tspan><tspan class="bit-1">111</tspan><tspan class="bit-0">0000</tspan><tspan class="bit-1">1</tspan><tspan class="bit-0">0</tspan><tspan class="bit-1">11</tspan><tspan class="bit-0">0</tspan><tspan class="sp">                 </tspan></text>
