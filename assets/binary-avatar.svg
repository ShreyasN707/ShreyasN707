<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 405" width="880" height="405">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111620" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="25" y="52" width="440" height="328" rx="8" />
    </clipPath>
  </defs>

  <style>
    .card {
      fill: url(#bgGrad);
      stroke: #30363d;
      stroke-width: 1.2;
      rx: 12px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1.1px;
    }
    .sp {
      fill: transparent;
    }
    .bit-0 {
      fill: #38bdf8;
      font-weight: 600;
      opacity: 0.82;
    }
    .bit-1 {
      fill: #ffffff;
      font-weight: 800;
      filter: drop-shadow(0 0 1.5px #58a6ff);
    }
    .term-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .term-text {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace;
      font-size: 11.5px;
      fill: #c9d1d9;
    }
    .term-dim {
      fill: #7d8590;
    }
    .term-accent {
      fill: #58a6ff;
      font-weight: 600;
    }
    .term-cyan {
      fill: #38bdf8;
      font-weight: 600;
    }
    .term-green {
      fill: #3fb950;
      font-weight: 600;
    }
    .term-yellow {
      fill: #e3b341;
    }
    .term-purple {
      fill: #bc8cff;
    }

    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(325px); opacity: 0; }
    }
    .scanline {
      animation: scan 4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #58a6ff;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    .pulse {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Base Window -->
  <rect x="2" y="2" width="876" height="401" class="card" />

  <!-- Terminal Window Top Bar -->
  <path d="M 2 2 L 878 2 Q 878 2 878 2 L 878 36 L 2 36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="878" y2="36" stroke="#30363d" stroke-width="1.2" />

  <!-- Window Dots -->
  <circle cx="24" cy="19" r="5" fill="#ff5f56" />
  <circle cx="40" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="19" r="5" fill="#27c93f" />

  <!-- Title Center -->
  <text x="440" y="23" text-anchor="middle" class="term-title">shreyas@workstation: ~/biometrics/avatar.bin (BINARY_CODED_01)</text>
  <text x="856" y="22" text-anchor="end" class="mono term-dim" font-size="9.5">UTF-8 // 0x707</text>

  <!-- Left: Binary Picture Terminal Screen -->
  <rect x="25" y="50" width="440" height="332" rx="8" fill="url(#screenGrad)" stroke="#21262d" stroke-width="1.2" />
  
  <!-- Mini Screen Header -->
  <rect x="25" y="50" width="440" height="22" fill="#0d1117" />
  <line x1="25" y1="72" x2="465" y2="72" stroke="#21262d" stroke-width="1" />
  <text x="35" y="65" class="mono term-accent" font-size="9.5">&gt; RASTERIZE: AVATAR.BIN [FORMAT: 0 &amp; 1]</text>
  <text x="455" y="65" text-anchor="end" class="mono term-green" font-size="9">LIVE</text>
  <circle cx="423" cy="62" r="2.5" fill="#3fb950" />

