    <text x="38" y="252.4" xml:space="preserve" class="mono"><tspan class="sp">            </tspan><tspan class="bit-1">11111111111111111111111111111111111</tspan><tspan class="bit-0">00</tspan><tspan class="sp">       </tspan></text>
    <text x="38" y="265.2" xml:space="preserve" class="mono"><tspan class="sp">       </tspan><tspan class="bit-0">000</tspan><tspan class="bit-1">111111111111111111111111111111111</tspan><tspan class="bit-0">00</tspan><tspan class="sp">           </tspan></text>
