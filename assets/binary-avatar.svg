  <!-- Right: Identity & Telemetry Container -->
  <g transform="translate(485, 50)">
    <rect x="0" y="0" width="370" height="332" rx="8" fill="#0c1017" stroke="#21262d" stroke-width="1.2" />
    
    <!-- Header banner in card -->
    <rect x="0" y="0" width="370" height="22" fill="#0f141d" />
    <line x1="0" y1="22" x2="370" y2="22" stroke="#21262d" stroke-width="1" />
    <text x="14" y="15" class="mono term-accent" font-size="9.5">┌── [ OPERATOR_PROFILE ]</text>
    <text x="356" y="15" text-anchor="end" class="mono term-dim" font-size="9">ID: #103553912</text>

    <!-- Bio Details -->
